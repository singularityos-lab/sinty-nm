name: release

# Builds the release binary on a version tag and attaches it to the GitHub
# release. singularity-os then fetches this asset at build time instead of
# carrying a committed binary. sinty-nmd is a pure-Go static binary
# (CGO_ENABLED=0), so it needs no cross toolchain or OS SDK; a plain Go build
# produces a portable executable.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build static sinty-nmd for each architecture
        run: |
          for arch in amd64:x86_64 arm64:aarch64; do
            CGO_ENABLED=0 GOARCH="${arch%%:*}" go build -trimpath -ldflags "-s -w" -o sinty-nmd ./cmd/sinty-nmd
            tar czf "sinty-nmd-${GITHUB_REF_NAME}-${arch#*:}.tar.gz" sinty-nmd
          done

      - name: Attach the binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: sinty-nmd-*.tar.gz
