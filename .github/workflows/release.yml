name: release

# Builds the release binary on a version tag and attaches it to the GitHub
# release. sinty-nmd links the Sinty system core, so each tarball carries the
# core library next to the binary, found through an $ORIGIN rpath.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build sinty-nmd for each architecture
        run: sh packaging/release.sh "$GITHUB_REF_NAME"

      - name: Attach the binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: sinty-nmd-*.tar.gz
